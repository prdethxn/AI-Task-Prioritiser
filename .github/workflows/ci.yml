name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies Installation
        run: pip install -r requirements.txt

      - name: Run Unit Tests
        run: pytest ./tests/
        env:
          PYTHONPATH: src

      - name: Run Linting
        run: flake8 src/ tests/
